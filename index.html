<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Glass Smash</title>
<style>
  :root{--cy:#25F4EE;--pk:#FE2C55;--u:min(1vw,0.55vh)}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff}
  #app{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hud{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2);pointer-events:none;z-index:20}
  .bal{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:calc(var(--u)*2.2);padding:calc(var(--u)*1.6) calc(var(--u)*5) calc(var(--u)*1.6) calc(var(--u)*1.6);border-radius:999px;background:rgba(22,22,26,.78);border:1.5px solid rgba(255,255,255,.14);box-shadow:-2px -1px 0 rgba(37,244,238,.55),2px 1px 0 rgba(254,44,85,.55),0 8px 24px rgba(0,0,0,.5);transition:transform .12s}
  .bal img{width:calc(var(--u)*10);height:calc(var(--u)*10);object-fit:contain}
  .bal .num{font-weight:900;font-size:calc(var(--u)*7.4);font-variant-numeric:tabular-nums}
  .bal.bump{transform:scale(1.12)}
  .prog{width:calc(var(--u)*52);height:calc(var(--u)*1.5);border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;transition:opacity .3s}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--pk));border-radius:9px}
  .screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*4.5);background:radial-gradient(ellipse at 50% 38%,rgba(40,40,50,.6),rgba(0,0,0,.92) 70%);text-align:center;padding:0 6vw;box-sizing:border-box}
  .screen.hide{display:none}
  .glitch{font-weight:900;letter-spacing:1px;line-height:.95;color:#fff;text-shadow:calc(var(--u)*-.7) calc(var(--u)*-.4) 0 var(--cy),calc(var(--u)*.7) calc(var(--u)*.4) 0 var(--pk)}
  .title{font-size:calc(var(--u)*13)}
  .sub{font-size:calc(var(--u)*4.4);color:rgba(255,255,255,.75);font-weight:600}
  .bigcoin{width:calc(var(--u)*36);height:calc(var(--u)*36);object-fit:contain;animation:bob 2.4s ease-in-out infinite;filter:drop-shadow(-6px -3px 18px rgba(37,244,238,.45)) drop-shadow(6px 3px 18px rgba(254,44,85,.45))}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(calc(var(--u)*-3)) rotate(6deg)}}
  .btn{pointer-events:auto;cursor:pointer;border:none;color:#fff;font-weight:800;font-size:calc(var(--u)*5.6);padding:calc(var(--u)*3.4) calc(var(--u)*12);border-radius:calc(var(--u)*2);background:var(--pk);box-shadow:0 10px 30px rgba(254,44,85,.45);font-family:inherit}
  .btn.pulse{animation:pulse 1.1s ease-in-out infinite}
  .btn.wide{width:100%;max-width:calc(var(--u)*80);padding-left:0;padding-right:0}
  .btn:disabled{opacity:.45}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 7vh);left:0;right:0;text-align:center;font-weight:800;font-size:calc(var(--u)*5);text-shadow:-2px -1px 0 var(--cy),2px 1px 0 var(--pk);pointer-events:none;z-index:4;transition:opacity .5s}
  .fly{position:absolute;z-index:21;pointer-events:none;width:calc(var(--u)*11);height:calc(var(--u)*11);margin:calc(var(--u)*-5.5) 0 0 calc(var(--u)*-5.5);object-fit:contain}
  .plus{position:absolute;z-index:21;pointer-events:none;font-weight:900;font-size:calc(var(--u)*7.5);text-shadow:-2px -1px 0 var(--cy),2px 1px 0 var(--pk),0 3px 8px rgba(0,0,0,.6);transform:translate(-50%,-50%)}

  /* congrats */
  .won{display:flex;align-items:center;gap:calc(var(--u)*2.4);font-weight:900;font-size:calc(var(--u)*12)}
  .won img{width:calc(var(--u)*14);height:calc(var(--u)*14)}
  .card{width:100%;max-width:calc(var(--u)*80);background:#161619;border:1px solid rgba(255,255,255,.1);border-radius:calc(var(--u)*4);padding:calc(var(--u)*5);box-sizing:border-box;display:flex;flex-direction:column;gap:calc(var(--u)*3.2)}
  .card label{font-size:calc(var(--u)*4);color:rgba(255,255,255,.6);font-weight:700;text-align:left}
  .inp{display:flex;align-items:center;background:#2a2a2f;border-radius:calc(var(--u)*2);padding:0 calc(var(--u)*3.4);border:2px solid transparent}
  .inp:focus-within{border-color:var(--cy)}
  .paste{flex:none;cursor:pointer;border:none;font-family:inherit;font-weight:800;font-size:calc(var(--u)*4.2);color:#000;background:var(--cy);border-radius:calc(var(--u)*1.6);padding:calc(var(--u)*2) calc(var(--u)*3.6);box-shadow:2px 2px 0 var(--pk)}
  .paste:active{transform:scale(.94)}
  .inp span{font-size:calc(var(--u)*5.6);font-weight:800;color:rgba(255,255,255,.5)}
  .inp input{flex:1;min-width:0;background:none;border:none;outline:none;color:#fff;font-size:max(16px,calc(var(--u)*5.6));font-weight:700;padding:calc(var(--u)*3.4) calc(var(--u)*1.5);font-family:inherit;-webkit-user-select:text;user-select:text}
  .conf{position:absolute;top:-5%;width:calc(var(--u)*2);height:calc(var(--u)*3.6);z-index:11;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}

  /* loading */
  .spin{width:calc(var(--u)*22);height:calc(var(--u)*22);position:relative}
  .spin i{position:absolute;top:50%;width:calc(var(--u)*7);height:calc(var(--u)*7);margin-top:calc(var(--u)*-3.5);border-radius:50%;mix-blend-mode:screen}
  .spin i:nth-child(1){background:var(--cy);animation:l1 .9s ease-in-out infinite}
  .spin i:nth-child(2){background:var(--pk);animation:l2 .9s ease-in-out infinite}
  @keyframes l1{0%,100%{left:10%}50%{left:58%}}
  @keyframes l2{0%,100%{left:58%}50%{left:10%}}
  .lbar{width:calc(var(--u)*70);height:calc(var(--u)*1.6);background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden}
  .lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--pk))}
  .lstep{font-size:calc(var(--u)*4.6);font-weight:700;min-height:1.3em}

  /* profile */
  #prof{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + var(--u)*34)}
  .close{position:absolute;left:calc(var(--u)*4);top:calc(env(safe-area-inset-top,0px) + var(--u)*4);width:calc(var(--u)*10);height:calc(var(--u)*10);display:flex;align-items:center;justify-content:center;font-size:calc(var(--u)*8);color:#fff;cursor:pointer;z-index:22;line-height:1}
  .ava{width:calc(var(--u)*28);height:calc(var(--u)*28);border-radius:50%;padding:calc(var(--u)*1);background:conic-gradient(var(--cy),var(--pk),var(--cy));box-sizing:border-box}
  .ava div{width:100%;height:100%;border-radius:50%;background:#1f1f24;border:calc(var(--u)*.9) solid #000;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:calc(var(--u)*12)}
  .nick{font-weight:800;font-size:calc(var(--u)*6)}
  .stats{display:flex;gap:calc(var(--u)*8);font-size:calc(var(--u)*3.6);color:rgba(255,255,255,.6)}
  .stats b{display:block;color:#fff;font-size:calc(var(--u)*5)}
  .coins{width:100%;max-width:calc(var(--u)*80);background:#161619;border-radius:calc(var(--u)*4);padding:calc(var(--u)*5);box-sizing:border-box;border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*2.4);position:relative;overflow:hidden}
  .coins .lbl{font-size:calc(var(--u)*4);color:rgba(255,255,255,.6);font-weight:700}
  .coins .row{display:flex;align-items:center;gap:calc(var(--u)*2.6)}
  .coins .row img{width:calc(var(--u)*14);height:calc(var(--u)*14);animation:bob 1.6s ease-in-out infinite}
  .coins .big{font-weight:900;font-size:calc(var(--u)*13);font-variant-numeric:tabular-nums;text-shadow:calc(var(--u)*-.5) calc(var(--u)*-.3) 0 var(--cy),calc(var(--u)*.5) calc(var(--u)*.3) 0 var(--pk)}
  .badge{font-size:calc(var(--u)*4);font-weight:800;color:var(--cy)}
  .rain{position:absolute;top:-12%;width:calc(var(--u)*8);height:calc(var(--u)*8);object-fit:contain;pointer-events:none;z-index:12;animation:fall linear forwards}
</style>
</head>

const coinImg=new Image(); coinImg.src=COIN_SRC;
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d'), app=$('app');
const numEl=$('num'), balEl=$('bal'), progEl=$('prog'), hintEl=$('hint');
let W=0,H=0,DPR=1,F=1,glowCv=null;

function fit(){
  const vv=window.visualViewport;
  const w=Math.round(vv?vv.width:innerWidth), h=Math.round(vv?vv.height:innerHeight); const W0=Math.max(w,h);
  app.style.width=w+'px'; app.style.height=h+'px';
  DPR=Math.min(window.devicePixelRatio||1,W0>900?1.25:1.5);
  W=w; H=h; cv.width=Math.round(w*DPR); cv.height=Math.round(h*DPR);
  F=Math.min(W*1.5,H*0.8)*0.95;
  glowCv=document.createElement('canvas'); glowCv.width=Math.max(1,Math.round(W/2)); glowCv.height=Math.max(1,Math.round(H/2));
  const gx=glowCv.getContext('2d'), r=gx.createRadialGradient(W/4,H*0.26,0,W/4,H*0.26,Math.max(W,H)*0.25);
  r.addColorStop(0,'rgba(255,255,255,.22)'); r.addColorStop(0.12,'rgba(254,44,85,.10)'); r.addColorStop(0.3,'rgba(37,244,238,.05)'); r.addColorStop(1,'rgba(0,0,0,0)');
  gx.fillStyle=r; gx.fillRect(0,0,glowCv.width,glowCv.height);
}

let fsTried=false;

  if(/Android/i.test(navigator.userAgent)&&rq){ try{ const p=rq.call(el); if(p&&p.catch) p.catch(()=>{}); }catch(e){} } }

/* world */
const SPEED=8, HALFW=3.6, FLOOR=-2.4, CEIL=2.8;
const VALUES=[120,150,199,250,275,333,390,444,500,555,640,700,777,850,999,1100,1250,1500,1800,2500];
let state='start', camZ=0, panes=[], balls=[], shards=[], balance=0, levelGain=0, broken=0, lastT=0;

function buildLevel(){
  panes=[];
  const N=15+Math.floor(Math.random()*6);
  const vals=VALUES.slice().sort(()=>Math.random()-0.5).slice(0,N);
  let vi=0, i=0;
  while(vi<N){
    const z=12+i*5.5;
    if(i%5===4&&N-vi>=2){
      for(let k=0;k<2;k++) panes.push({x:k?1.6:-1.6,y:-0.1+Math.random()*0.5,z:z+(k?1.2:0),w:2.6,h:2.8,v:vals[vi++],hit:false,tilt:(Math.random()-0.5)*0.1,ph:Math.random()*6});
    }else{
      const w=2.9+Math.random()*0.5;
      panes.push({x:-1.1+Math.random()*2.2,y:-0.4+Math.random()*0.9,z,w,h:w*(1+Math.random()*0.15),v:vals[vi++],hit:false,tilt:(Math.random()-0.5)*0.12,ph:Math.random()*6});
    }
    i++;
  }
}
function respawn(p){
  let far=camZ+10;
  for(const q of panes) if(!q.hit&&q!==p&&q.z>far) far=q.z;
  const w=2.9+Math.random()*0.5;
  p.z=far+5.5; p.w=w; p.h=w*(1+Math.random()*0.15);
  p.x=-1.1+Math.random()*2.2; p.y=-0.4+Math.random()*0.9;
}

function proj(x,y,z){ const dz=z-camZ; if(dz<0.25) return null; const s=F/dz; return {x:W/2+x*s,y:H*0.52-y*s,s}; }
function fogA(dz){ return Math.max(0,Math.min(1,(110-dz)/70)); }

function quad(pts,fill){ const P=pts.map(p=>proj(p[0],p[1],p[2])); if(P.some(p=>!p)) return; ctx.beginPath(); P.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); }
function line(a,b){ const p=proj(a[0],a[1],a[2]), q=proj(b[0],b[1],b[2]); if(!p||!q) return; ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke(); }
function rectAt(z,off){ const a=proj(-HALFW,CEIL,z), b=proj(HALFW,FLOOR,z); if(!a||!b) return; ctx.strokeRect(a.x+off,a.y+off*0.6,b.x-a.x,b.y-a.y); }

function drawBG(t){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  const far=camZ+120, near=camZ+0.6;
  quad([[-HALFW,FLOOR,near],[HALFW,FLOOR,near],[HALFW,FLOOR,far],[-HALFW,FLOOR,far]],'#0b0b0e');
  quad([[-HALFW,CEIL,near],[HALFW,CEIL,near],[HALFW,CEIL,far],[-HALFW,CEIL,far]],'#070709');
  quad([[-HALFW,FLOOR,near],[-HALFW,CEIL,near],[-HALFW,CEIL,far],[-HALFW,FLOOR,far]],'#111116');
  quad([[HALFW,FLOOR,near],[HALFW,CEIL,near],[HALFW,CEIL,far],[HALFW,FLOOR,far]],'#111116');
  if(glowCv) ctx.drawImage(glowCv,0,0,W,H);
  // grid
  ctx.lineWidth=1;
  const step=3, start=Math.ceil(camZ/step)*step;
  for(let z=start;z<camZ+100;z+=step){
    const dz=z-camZ; if(dz<0.6) continue; const a=fogA(dz)*0.35;
    ctx.strokeStyle='rgba(255,255,255,'+a+')';
    line([-HALFW,FLOOR,z],[HALFW,FLOOR,z]);
  }
  ctx.strokeStyle='rgba(255,255,255,.12)';
  for(let x=-HALFW;x<=HALFW+0.01;x+=HALFW/3) line([x,FLOOR,near],[x,FLOOR,far]);
  ctx.strokeStyle='rgba(37,244,238,.35)'; line([-HALFW,FLOOR,near],[-HALFW,FLOOR,far]); line([-HALFW,CEIL,near],[-HALFW,CEIL,far]);
  ctx.strokeStyle='rgba(254,44,85,.35)'; line([HALFW,FLOOR,near],[HALFW,FLOOR,far]); line([HALFW,CEIL,near],[HALFW,CEIL,far]);
  // glitch neon frames (cyan + pink offset)
  const fs=8, fstart=Math.ceil(camZ/fs)*fs+4;
  for(let z=fstart;z<camZ+110;z+=fs){
    const dz=z-camZ; if(dz<0.8) continue; const a=fogA(dz);
    const lw=Math.max(1.5,F/dz*0.07), off=Math.max(1,F/dz*0.05);
    ctx.lineWidth=lw*3.2;
    ctx.strokeStyle='rgba(37,244,238,'+(a*0.16)+')'; rectAt(z,-off);
    ctx.strokeStyle='rgba(254,44,85,'+(a*0.16)+')'; rectAt(z,off);
    ctx.lineWidth=lw;
    ctx.strokeStyle='rgba(37,244,238,'+a+')'; rectAt(z,-off);
    ctx.strokeStyle='rgba(254,44,85,'+a+')'; rectAt(z,off);
  }
}

function drawPane(p,t){
  const dz=p.z-camZ; if(dz<0.3||dz>115) return;
  const a=fogA(dz), bob=Math.sin(t*1.6+p.ph)*0.08;
  const c=proj(p.x,p.y+bob,p.z); if(!c) return;
  const w=p.w*c.s, h=p.h*c.s, lw=Math.max(1.5,c.s*0.05), off=Math.max(1,c.s*0.05);
  ctx.save(); ctx.globalAlpha=a; ctx.translate(c.x,c.y); ctx.rotate(p.tilt);
  ctx.fillStyle='rgba(150,200,230,.2)'; ctx.fillRect(-w/2,-h/2,w,h);
  ctx.lineWidth=lw;
  ctx.strokeStyle=CY; ctx.strokeRect(-w/2-off,-h/2-off,w,h);
  ctx.strokeStyle=PK; ctx.strokeRect(-w/2+off,-h/2+off,w,h);
  ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.strokeRect(-w/2,-h/2,w,h);
  ctx.beginPath(); ctx.moveTo(-w/2+w*0.08,-h/2+h*0.5); ctx.lineTo(-w/2+w*0.5,-h/2+h*0.08); ctx.lineTo(-w/2+w*0.64,-h/2+h*0.08); ctx.lineTo(-w/2+w*0.08,-h/2+h*0.66); ctx.closePath();
  ctx.fillStyle='rgba(255,255,255,.22)'; ctx.fill();
  const cs=Math.min(w,h)*0.55;
  if(coinImg.complete) ctx.drawImage(coinImg,-cs/2,-cs/2-h*0.06,cs,cs*coinImg.height/coinImg.width);
  if(c.s>8){
    const fsz=Math.max(9,c.s*0.42), ty=h/2-c.s*0.42;
    ctx.font='900 '+fsz+'px -apple-system,Arial,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const txt='+'+p.v.toLocaleString('en-US');
    ctx.fillStyle=CY; ctx.fillText(txt,-off,ty-off*0.6);
    ctx.fillStyle=PK; ctx.fillText(txt,off,ty+off*0.6);
    ctx.fillStyle='#fff'; ctx.fillText(txt,0,ty);
  }
  ctx.restore();
}

function drawBall(b){
  const c=proj(b.x,b.y,b.z); if(!c) return;
  const r=Math.max(2,0.17*c.s);
  const sh=proj(b.x,FLOOR,b.z); if(sh){ ctx.fillStyle='rgba(255,255,255,.08)'; ctx.beginPath(); ctx.ellipse(sh.x,sh.y,r*1.1,r*0.35,0,0,7); ctx.fill(); }
  ctx.fillStyle=CY; ctx.beginPath(); ctx.arc(c.x-r*0.18,c.y-r*0.1,r,0,7); ctx.fill();
  ctx.fillStyle=PK; ctx.beginPath(); ctx.arc(c.x+r*0.18,c.y+r*0.1,r,0,7); ctx.fill();
  const g=ctx.createRadialGradient(c.x-r*0.35,c.y-r*0.35,r*0.1,c.x,c.y,r);
  g.addColorStop(0,'#ffffff'); g.addColorStop(0.5,'#d9dbe2'); g.addColorStop(1,'#6b6f7c');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(c.x,c.y,r,0,7); ctx.fill();
}

function drawShard(s){
  const c=proj(s.x,s.y,s.z); if(!c) return;
  const r=s.r*c.s; ctx.save(); ctx.globalAlpha=Math.max(0,Math.min(1,s.life))*fogA(s.z-camZ);
  ctx.translate(c.x,c.y); ctx.rotate(s.rot);
  ctx.beginPath(); ctx.moveTo(s.p[0]*r,s.p[1]*r); ctx.lineTo(s.p[2]*r,s.p[3]*r); ctx.lineTo(s.p[4]*r,s.p[5]*r); ctx.closePath();
  ctx.fillStyle=s.c; ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.lineWidth=1; ctx.stroke();
  ctx.restore();
}

function throwBall(sx,sy){
  const dx=(sx-W/2)/F, dy=-(sy-H*0.52)/F;
  const len=Math.hypot(dx,dy,1), sp=46;
  balls.push({x:0,y:-0.6,z:camZ+0.4,vx:dx/len*sp,vy:dy/len*sp+1.2,vz:1/len*sp+SPEED,life:3});
  snd('throw');
}

function smash(p,hx){
  p.hit=true; broken++;
  const cols=['rgba(37,244,238,.6)','rgba(254,44,85,.6)','rgba(255,255,255,.55)'];
  for(let i=0;i<16;i++){
    const ang=Math.random()*Math.PI*2, sp=1+Math.random()*4, p6=[];
    for(let k=0;k<3;k++){ const a=Math.random()*Math.PI*2; p6.push(Math.cos(a),Math.sin(a)); }
    shards.push({x:p.x+(Math.random()-0.5)*p.w,y:p.y+(Math.random()-0.5)*p.h,z:p.z,vx:Math.cos(ang)*sp+(hx-p.x),vy:Math.sin(ang)*sp+1.5,vz:2+Math.random()*5,r:0.14+Math.random()*0.26,rot:Math.random()*6,vr:(Math.random()-0.5)*14,p:p6,c:cols[i%3],life:1.6});
  }
  snd('glass');
  const c=proj(p.x,p.y,p.z);
  if(c) flyCoin(c.x,c.y,p.v); else addBalance(p.v);
}

function flyCoin(x,y,v){
  const im=document.createElement('img'); im.src=COIN_SRC; im.className='fly'; app.appendChild(im);
  const pl=document.createElement('div'); pl.className='plus'; pl.textContent='+'+v.toLocaleString('en-US'); app.appendChild(pl);
  const br=balEl.getBoundingClientRect(), ar=app.getBoundingClientRect();
  const tx=br.left-ar.left+br.height*0.5, ty=br.top-ar.top+br.height*0.5;
  const t0=performance.now(), D=650;
  (function step(now){
    const k=Math.min(1,(now-t0)/D), e=k*k*(3-2*k);
    im.style.left=(x+(tx-x)*e)+'px'; im.style.top=(y+(ty-y)*e-Math.sin(k*Math.PI)*H*0.12)+'px';
    im.style.transform='scale('+(1.3-0.6*k)+') rotate('+(k*540)+'deg)';
    pl.style.left=x+'px'; pl.style.top=(y-k*H*0.08)+'px'; pl.style.opacity=String(1-k);
    if(k<1) requestAnimationFrame(step); else { im.remove(); pl.remove(); addBalance(v); }
  })(t0);
}

let shown=0, bumpT=0, lastNum='';
function addBalance(v,quiet){ balance+=v; if(!quiet){ levelGain+=v; snd('coin'); } balEl.classList.add('bump'); clearTimeout(bumpT); bumpT=setTimeout(()=>balEl.classList.remove('bump'),130); }
function fmt(n){ return Math.round(n).toLocaleString('en-US'); }

function update(dt,t){
  if(state==='play'){
    camZ+=SPEED*dt;
    for(const p of panes) if(!p.hit&&p.z<camZ+0.6) respawn(p);
    const pw=(broken/panes.length*100)+'%'; if(progEl.style.width!==pw) progEl.style.width=pw;
    if(broken>=panes.length) finish();
  }
  for(const b of balls){
    const pz=b.z;
    b.vy-=9*dt; b.x+=b.vx*dt; b.y+=b.vy*dt; b.z+=b.vz*dt; b.life-=dt;
    if(b.y<FLOOR+0.17){ b.y=FLOOR+0.17; b.vy=Math.abs(b.vy)*0.45; }
    if(Math.abs(b.x)>HALFW-0.17){ b.x=Math.sign(b.x)*(HALFW-0.17); b.vx*=-0.6; }
    for(const p of panes){
      if(p.hit) continue;
      if(pz<p.z&&b.z>=p.z){
        const k=(p.z-pz)/(b.z-pz), hx=b.x-b.vx*dt*(1-k), hy=b.y-b.vy*dt*(1-k);
        const py=p.y+Math.sin(t*1.6+p.ph)*0.08;
        if(Math.abs(hx-p.x)<p.w/2+0.25&&Math.abs(hy-py)<p.h/2+0.25){ smash(p,hx); b.vz*=0.85; }
      }
    }
  }
  balls=balls.filter(b=>b.life>0&&b.z<camZ+120);
  for(const s of shards){ s.vy-=9*dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.z+=s.vz*dt; s.rot+=s.vr*dt; s.life-=dt*0.8; if(s.y<FLOOR){s.y=FLOOR;s.vy*=-0.3;s.vx*=0.6;} }
  shards=shards.filter(s=>s.life>0&&s.z>camZ+0.3); if(shards.length>140) shards.splice(0,shards.length-140);
  shown+=(balance-shown)*Math.min(1,dt*10); if(Math.abs(balance-shown)<1) shown=balance;
  const nt=fmt(shown); if(nt!==lastNum){ lastNum=nt; numEl.textContent=nt; }
}

function render(t){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  drawBG(t);
  const items=[];
  for(const p of panes) if(!p.hit) items.push({z:p.z,f:()=>drawPane(p,t)});
  for(const s of shards) items.push({z:s.z,f:()=>drawShard(s)});
  for(const b of balls) items.push({z:b.z,f:()=>drawBall(b)});
  items.sort((a,b)=>b.z-a.z); items.forEach(i=>i.f());
}

function loop(now){
  const t=now/1000, dt=Math.min(0.05,lastT?t-lastT:0.016); lastT=t;
  if(state==='end'||state==='flow') camZ+=SPEED*0.25*dt;
  update(dt,t); render(t);
  requestAnimationFrame(loop);
}

/* screens */
const screens=['start','congrats','load','prof'];
function show(id){ screens.forEach(s=>$(s).classList.toggle('hide',s!==id)); $('progw').style.opacity=id?'0':'1'; }

function start(){
  buildLevel(); camZ=0; balls=[]; shards=[]; levelGain=0; broken=0;
  show(null);
  hintEl.style.opacity='1'; setTimeout(()=>hintEl.style.opacity='0',2000);
  state='play';
}
function finish(){
  state='end'; hintEl.style.opacity='0';
  setTimeout(()=>{
    if(state!=='end') return;
    $('won').textContent=fmt(levelGain); $('nick').value='';
    show('congrats'); confetti(); snd('win');
  },650);
}
function confetti(){
  const cols=[CY,PK,'#fff'];
  for(let i=0;i<70;i++){
    const d=document.createElement('div'); d.className='conf';
    d.style.left=Math.random()*100+'%'; d.style.background=cols[i%3];
    d.style.animationDuration=(1.8+Math.random()*1.8)+'s'; d.style.animationDelay=(Math.random()*0.6)+'s';
    $('congrats').appendChild(d); setTimeout(()=>d.remove(),4500);
  }
}

let flowTimers=[], tickIv=0;
function clearFlow(){ flowTimers.forEach(clearTimeout); flowTimers=[]; clearInterval(tickIv); }
function sendFlow(){
  let nick=$('nick').value.trim().replace(/^@+/,'').replace(/\s+/g,'_');
  if(!nick){ nick='user'+Math.floor(10000+Math.random()*89999); }
  $('nick').blur(); state='flow';
  show('load');
  const steps=['Searching account…','Account found: @'+nick,'Connecting…','Sending '+fmt(levelGain)+' coins…'];
  const lbar=$('lbar'); lbar.style.transition='none'; lbar.style.width='0';
  requestAnimationFrame(()=>{ lbar.style.transition='width 1.5s linear'; lbar.style.width='100%'; });
  steps.forEach((s,i)=>flowTimers.push(setTimeout(()=>$('lstep').textContent=s,i*375)));
  flowTimers.push(setTimeout(()=>profile(nick),1500));
}
function profile(nick){
  $('pnick').textContent='@'+nick; $('avaL').textContent=nick[0].toUpperCase();
  $('st1').textContent=Math.floor(80+Math.random()*400);
  $('st2').textContent=fmt(500+Math.random()*9000);
  $('st3').textContent=fmt(2000+Math.random()*60000);
  $('badge').textContent='Adding coins…'; $('badge').style.color=CY;
  show('prof');
  const pbal=$('pbal'), target=levelGain; let cur=0;
  const t0=performance.now(), D=3000;
  pbal.textContent='0';
  coinRain();
  tickIv=setInterval(()=>{
    const k=Math.min(1,(performance.now()-t0)/D), e=1-Math.pow(1-k,2);
    cur=target*e; pbal.textContent=fmt(cur); snd('tick');
    if(k>=1){ clearInterval(tickIv); pbal.textContent=fmt(target); $('badge').textContent='✓ Coins added to @'+nick; $('badge').style.color='#fff'; snd('win');
      // keeps boosting slowly
      let extra=target; tickIv=setInterval(()=>{ extra+=Math.floor(5+Math.random()*40); pbal.textContent=fmt(extra); addBalance(extra-target-(balance-ownedBase),true); },180);
    }
  },60);
  ownedBase=balance;
}
let ownedBase=0;
function coinRain(){
  const el=$('prof');
  for(let i=0;i<26;i++){
    const im=document.createElement('img'); im.src=COIN_SRC; im.className='rain';
    im.style.left=(Math.random()*95)+'%'; im.style.animationDuration=(1.6+Math.random()*1.6)+'s'; im.style.animationDelay=(Math.random()*1.6)+'s';
    el.appendChild(im); setTimeout(()=>im.remove(),5000);
  }
}
function resetAll(){
  clearFlow(); balance=0; shown=0; lastNum='0'; numEl.textContent='0'; state='start';
  buildLevel(); camZ=0; balls=[]; shards=[]; progEl.style.width='0';
  hintEl.style.opacity='0'; show('start');
}

cv.addEventListener('pointerdown',e=>{ tryFS(); if(state!=='play') return; const r=cv.getBoundingClientRect(); throwBall(e.clientX-r.left,e.clientY-r.top); hintEl.style.opacity='0'; });
$('play').addEventListener('click',e=>{ tryFS(); snd('coin'); start(); });
$('send').addEventListener('click',()=>{ tryFS(); sendFlow(); });
function randNick(){
  const a=['lil','its','the','real','not','just','im','xo','mr','ms','big','iam'];
  const b=['vibes','gamer','queen','king','luna','nova','sky','milo','zoe','kai','leo','mia','ace','pixel','star','neon','shadow','coco','blaze','ruby'];
  const pick=x=>x[Math.floor(Math.random()*x.length)];
  const sep=pick(['','_','.','']);
  let n=(Math.random()<0.5?pick(a)+sep:'')+pick(b)+(Math.random()<0.3?'_'+pick(b):'');
  n+=Math.random()<0.75?String(Math.floor(Math.random()*99)):'';
  return n.slice(0,14);
}
$('paste').addEventListener('click',e=>{ e.preventDefault(); $('nick').value=randNick(); });
$('nick').addEventListener('keydown',e=>{ if(e.key==='Enter') sendFlow(); });
$('again').addEventListener('click',()=>{ clearFlow(); start(); });
$('close').addEventListener('click',resetAll);
balEl.addEventListener('pointerdown',e=>{ e.stopPropagation(); resetAll(); });
document.addEventListener('touchmove',e=>{ if(e.target.tagName!=='INPUT') e.preventDefault(); },{passive:false});

hintEl.style.opacity='0'; show('start'); $('progw').style.opacity='0';
buildLevel();
requestAnimationFrame(loop);
})();
</script>
